<script>

class DCLogic{constructor(p){this.props=p||{};this.state={}}setState(o){Object.assign(this.state,o);if(!window.__noRender)render()}}
const get=(p,s)=>{p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce((o,k)=>o==null?o:o[k],s)};
const one=/^\{\{\s*([\w.]+)\s*\}\}$/;
const interp=(t,s)=>t.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{const v=get(p,s);return v==null?'':v});
function walk(src,s,out){for(const n of src.childNodes){
 if(n.nodeType===3){out.appendChild(document.createTextNode(n.data.includes('{{')?interp(n.data,s):n.data));continue}
 if(n.nodeType!==1)continue;
 if(n.tagName==='TEMPLATE'&&n.dataset.for!==undefined){const list=get(n.dataset.for,s)||[];for(const it of list){walk(n.content,Object.assign({},s,{[n.dataset.as]:it}),out)}continue}
 if(n.tagName==='TEMPLATE'&&n.dataset.if!==undefined){if(get(n.dataset.if,s))walk(n.content,s,out);continue}
 const el=document.createElement(n.tagName.toLowerCase());
 for(const a of n.attributes){const m=a.value.match(one);
  if(a.name.startsWith('on')&&m){const fn=get(m[1],s);const ev=a.name.slice(2);if(typeof fn==='function'){el.addEventListener(ev==='change'?'change':ev,e=>{if(ev==='input'){window.__noRender=true;fn(e);window.__noRender=false}else fn(e)})}continue}
  if(a.name.startsWith('hint-'))continue;
  el.setAttribute(a.name,a.value.includes('{{')?interp(a.value,s):a.value)}
 walk(n.content||n,s,el);
 if(el.tagName==='INPUT'&&el.hasAttribute('value'))el.value=el.getAttribute('value');
 out.appendChild(el)}}
let comp;
function render(){const root=document.getElementById('root');const sels=[...root.querySelectorAll('select')].map(x=>x.value);const y=window.scrollY;
 const frag=document.createDocumentFragment();walk(document.getElementById('page').content,comp.renderVals(),frag);root.replaceChildren(frag);
 [...root.querySelectorAll('select')].forEach((x,i)=>{if(sels[i]!==undefined)x.value=sels[i]});window.scrollTo(0,y)}


class Component extends DCLogic {
constructor(p) { super(p); this.state = { s: 0 }; }
renderVals() {
const S = [
{ label: 'Кузовные цеха', img: 'img/mech.jpg', h: 'Фары после ДТП — ремонт вместо замены', text: 'Вы получаете фару, которая выглядит и светит как новая, а клиент экономит. Забираем фары курьером и возвращаем в срок.', points: ['Забор и доставка по Петербургу бесплатно от 3 фар', 'Срок 24–48 часов по типовым работам', 'Фото до и после для отчёта страховой', 'Гарантия 2 года на нашу работу'], prices: [{ t: 'Замена стекла фары', p: 'от 6 500 ₽' }, { t: 'Ремонт креплений', p: 'от 2 000 ₽' }, { t: 'Переборка на новом герметике', p: 'от 5 000 ₽' }] },
{ label: 'Дилеры и перекупщики', img: 'img/dealer.jpg', h: 'Предпродажная подготовка оптики', text: 'Мутные и потеющие фары снижают цену машины. Пакет подготовки за фиксированную цену возвращает «свежий» вид.', points: ['Пакет «фары + ДХО + полировка» по одной цене', 'Выезд на площадку при 5+ машинах', 'Срок 24 часа', 'Отчёт с фото для объявления'], prices: [{ t: 'Полировка и лак, пара фар', p: '2 400 ₽' }, { t: 'Пакет предпродажный', p: 'от 6 900 ₽' }, { t: 'Ремонт запотевания', p: 'от 5 000 ₽' }] },
{ label: 'Автопарки и такси', img: 'img/truck.jpg', h: 'Обменный фонд — машина не простаивает', text: 'Держим восстановленные фары на популярные модели парков. Меняем за час, вашу фару восстанавливаем и возвращаем в фонд.', points: ['Обмен за 1 час на популярные модели', 'Абонентское обслуживание оптики парка', 'Регулировка света по ГОСТ к техосмотру', 'Оплата по счёту раз в месяц'], prices: [{ t: 'Обмен фары из фонда', p: 'от 7 500 ₽' }, { t: 'Регулировка света', p: '700 ₽' }, { t: 'Абонемент на 10 машин', p: 'по запросу' }] },
{ label: 'Мастерские', img: 'img/board.jpg', h: 'Сложные работы на субподряд', text: 'Для студий и сервисов из Петербурга и регионов: берём то, на что у вас нет оборудования или опыта.', points: ['Ремонт LED-плат и драйверов', 'Восстановление отражателей', 'Редкие стёкла и корпуса', 'Приём по почте со всей России'], prices: [{ t: 'Ремонт LED-платы', p: 'от 7 000 ₽' }, { t: 'Восстановление отражателя', p: 'от 6 000 ₽' }, { t: 'Консультация мастера', p: 'бесплатно' }] }
];
return {
segs: S.map((x, i) => ({ label: x.label, on: i === this.state.s, off: i !== this.state.s, pick: () => this.setState({ s: i }) })),
seg: S[this.state.s]
};
}
}

comp=new Component({});render();
</script>
