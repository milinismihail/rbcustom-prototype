<div id="root"></div>
<script>

class DCLogic{constructor(p){this.props=p||{};this.state={}}setState(o){Object.assign(this.state,o);if(!window.__noRender)render()}}
const get=(p,s)=>{p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce((o,k)=>o==null?o:o[k],s)};
const one=/^\{\{\s*([\w.]+)\s*\}\}$/;
const interp=(t,s)=>t.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{const v=get(p,s);return v==null?'':v});
function walk(src,s,out){for(const n of src.childNodes){
 if(n.nodeType===3){out.appendChild(document.createTextNode(n.data.includes('{{')?interp(n.data,s):n.data));continue}
 if(n.nodeType!==1)continue;
 if(n.tagName==='TEMPLATE'&&n.dataset.for!==undefined){const list=get(n.dataset.for,s)||[];for(const it of list){walk(n.content,Object.assign({},s,{[n.dataset.as]:it}),out)}continue}
 if(n.tagName==='TEMPLATE'&&n.dataset.if!==undefined){if(get(n.dataset.if,s))walk(n.content,s,out);continue}
 const el=document.createElement(n.tagName.toLowerCase());
 for(const a of n.attributes){const m=a.value.match(one);
  if(a.name.startsWith('on')&&m){const fn=get(m[1],s);const ev=a.name.slice(2);if(typeof fn==='function'){el.addEventListener(ev==='change'?'change':ev,e=>{if(ev==='input'){window.__noRender=true;fn(e);window.__noRender=false}else fn(e)})}continue}
  if(a.name.startsWith('hint-'))continue;
  el.setAttribute(a.name,a.value.includes('{{')?interp(a.value,s):a.value)}
 walk(n.content||n,s,el);
 if(el.tagName==='INPUT'&&el.hasAttribute('value'))el.value=el.getAttribute('value');
 out.appendChild(el)}}
let comp;
function render(){const root=document.getElementById('root');const sels=[...root.querySelectorAll('select')].map(x=>x.value);const y=window.scrollY;
 const frag=document.createDocumentFragment();walk(document.getElementById('page').content,comp.renderVals(),frag);root.replaceChildren(frag);
 [...root.querySelectorAll('select')].forEach((x,i)=>{if(sels[i]!==undefined)x.value=sels[i]});window.scrollTo(0,y)}


class Component extends DCLogic {
constructor(p) { super(p); this.state = { tag: 'all', brand: 'Все марки' }; }
renderVals() {
const I = { hero: 'img/hero.jpg', hl1: 'img/hl1.jpg', hl2: 'img/hl2.jpg', hl3: 'img/hl3.jpg', hl4: 'img/hl4.jpg', old: 'img/old.jpg', tail1: 'img/tail1.jpg', tail2: 'img/tail2.jpg', board: 'img/board.jpg' };
const L = { fog: 'Запотевание', dtp: 'После ДТП', led: 'LED и фонари', up: 'Улучшение света', pol: 'Полировка', mail: 'По почте' };
const A = [
{ tag: 'fog', brand: 'Toyota', car: 'Toyota RAV4 2020', text: 'Потела правая фара после каждой мойки.', price: '7 500 ₽', time: '1 день', img: I.hl1 },
{ tag: 'led', brand: 'Haval', car: 'Haval Jolion 2022', text: 'Погасла половина ДХО, заменили диоды и драйвер.', price: '11 500 ₽', time: '1 день', img: I.hl4 },
{ tag: 'dtp', brand: 'Geely', car: 'Geely Monjaro 2023', text: 'Сломаны крепления и трещина стекла.', price: '14 000 ₽', time: '2 дня', img: I.hl3 },
{ tag: 'led', brand: 'Zeekr', car: 'Zeekr 001', text: 'Не горела секция заднего фонаря.', price: '18 000 ₽', time: '2 дня', img: I.tail2 },
{ tag: 'up', brand: 'Mitsubishi', car: 'Mitsubishi Outlander 2016', text: 'Bi-LED с сертификатом вместо выгоревших линз.', price: '32 000 ₽', time: '1 день', img: I.hl2 },
{ tag: 'mail', brand: 'Lexus', car: 'Lexus RX 2018, Мурманск', text: 'Новое стекло и отражатель, возврат за 6 дней.', price: '19 000 ₽', time: '6 дней', img: I.hero },
{ tag: 'pol', brand: 'Kia', car: 'Kia Rio 2017', text: 'Мутные фары: шлифовка, полировка, лак.', price: '3 000 ₽', time: '3 часа', img: I.old },
{ tag: 'led', brand: 'Lixiang', car: 'Lixiang L7 2023', text: 'Ремонт LED-платы фонаря без замены.', price: '16 000 ₽', time: '2 дня', img: I.tail1 },
{ tag: 'fog', brand: 'Hyundai', car: 'Hyundai Tucson 2019', text: 'Вода в фаре после трещины корпуса.', price: '9 500 ₽', time: '1 день', img: I.hl2 },
{ tag: 'led', brand: 'BMW', car: 'BMW X5 G05', text: 'Не горел адаптивный модуль, ремонт драйвера.', price: '38 000 ₽', time: '3 дня', img: I.board },
{ tag: 'dtp', brand: 'Chery', car: 'Chery Tiggo 7 Pro 2022', text: 'Трещина стекла после камня на трассе.', price: '12 000 ₽', time: '2 дня', img: I.hl3 },
{ tag: 'up', brand: 'Toyota', car: 'Toyota Camry 2015', text: 'Замена ксеноновых линз, регулировка по ГОСТ.', price: '26 000 ₽', time: '1 день', img: I.hero }
];
const brands = ['Все марки'].concat(Array.from(new Set(A.map((a) => a.brand))).sort());
const items = A.filter((a) => (this.state.tag === 'all' || a.tag === this.state.tag) && (this.state.brand === 'Все марки' || a.brand === this.state.brand)).map((a) => Object.assign({}, a, { tagLabel: L[a.tag] }));
const chipsSrc = [['all', 'Все']].concat(Object.keys(L).map((k) => [k, L[k]]));
return {
chips: chipsSrc.map(([k, l]) => ({ label: l, on: this.state.tag === k, off: this.state.tag !== k, pick: () => this.setState({ tag: k }) })),
brandOpts: brands,
setBrand: (e) => this.setState({ brand: e.target.value }),
items, count: items.length, empty: items.length === 0
};
}
}

comp=new Component({});render();
</script>
</body>
