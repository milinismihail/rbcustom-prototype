<script>

class DCLogic{constructor(p){this.props=p||{};this.state={}}setState(o){Object.assign(this.state,o);if(!window.__noRender)render()}}
const get=(p,s)=>{p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce((o,k)=>o==null?o:o[k],s)};
const one=/^\{\{\s*([\w.]+)\s*\}\}$/;
const interp=(t,s)=>t.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{const v=get(p,s);return v==null?'':v});
function walk(src,s,out){for(const n of src.childNodes){
 if(n.nodeType===3){out.appendChild(document.createTextNode(n.data.includes('{{')?interp(n.data,s):n.data));continue}
 if(n.nodeType!==1)continue;
 if(n.tagName==='TEMPLATE'&&n.dataset.for!==undefined){const list=get(n.dataset.for,s)||[];for(const it of list){walk(n.content,Object.assign({},s,{[n.dataset.as]:it}),out)}continue}
 if(n.tagName==='TEMPLATE'&&n.dataset.if!==undefined){if(get(n.dataset.if,s))walk(n.content,s,out);continue}
 const el=document.createElement(n.tagName.toLowerCase());
 for(const a of n.attributes){const m=a.value.match(one);
  if(a.name.startsWith('on')&&m){const fn=get(m[1],s);const ev=a.name.slice(2);if(typeof fn==='function'){el.addEventListener(ev==='change'?'change':ev,e=>{if(ev==='input'){window.__noRender=true;fn(e);window.__noRender=false}else fn(e)})}continue}
  if(a.name.startsWith('hint-'))continue;
  el.setAttribute(a.name,a.value.includes('{{')?interp(a.value,s):a.value)}
 walk(n.content||n,s,el);
 if(el.tagName==='INPUT'&&el.hasAttribute('value'))el.value=el.getAttribute('value');
 out.appendChild(el)}}
let comp;
function render(){const root=document.getElementById('root');const sels=[...root.querySelectorAll('select')].map(x=>x.value);const y=window.scrollY;
 const frag=document.createDocumentFragment();walk(document.getElementById('page').content,comp.renderVals(),frag);root.replaceChildren(frag);
 [...root.querySelectorAll('select')].forEach((x,i)=>{if(sels[i]!==undefined)x.value=sels[i]});window.scrollTo(0,y)}

renderVals() {
const C = [

] },

{ t: 'Замена стекла фары', d: 'Новое стекло, корпус свой', time: '1–2 дня', w: '12 мес.', p: 'от 9 500 ₽' },
{ t: 'Восстановление креплений («ушей»)', d: 'Пайка и армирование пластика', time: '3 часа', w: '12 мес.', p: 'от 3 500 ₽' },
{ t: 'Замена корпуса фары', d: 'Переносим внутренности в новый корпус', time: '2–3 дня', w: '12 мес.', p: 'от 14 000 ₽' },
{ t: 'Восстановление отражателя', d: 'Повторная металлизация', time: '3 дня', w: '12 мес.', p: 'от 6 000 ₽' }
] },
{ title: 'LED, ДХО, фонари', note: 'Ремонт электроники вместо замены блока', rows: [
{ t: 'Ремонт секции ДХО', d: 'Замена диодов и драйвера', time: '1 день', w: '12 мес.', p: 'от 9 000 ₽' },
{ t: 'Ремонт LED-модуля ближнего/дальнего', d: 'Восстановление платы или замена модуля', time: '1–2 дня', w: '12 мес.', p: 'от 12 000 ₽' },
{ t: 'Ремонт заднего фонаря', d: 'Плата, пайка, герметизация', time: '1–2 дня', w: '12 мес.', p: 'от 9 000 ₽' },
{ t: 'Ремонт адаптивного модуля (Matrix)', d: 'BMW, Audi, Mercedes', time: '3–5 дней', w: '12 мес.', p: 'от 28 000 ₽' },
{ t: 'Бегущий поворотник', d: 'Ремонт драйвера', time: '1 день', w: '12 мес.', p: 'от 8 500 ₽' }
] },
{ title: 'Улучшение света', note: 'Только с сертификатом и по ГОСТ', rows: [
{ t: 'Установка Bi-LED линз', d: 'Сертифицированные модули, регулировка', time: '1 день', w: '24 мес.', p: 'от 26 000 ₽' },
{ t: 'Замена мутных штатных линз', d: 'Галоген и ксенон', time: '1 день', w: '24 мес.', p: 'от 18 000 ₽' },
{ t: 'Восстановление ксенона', d: 'Блок розжига, лампа, линза', time: '1 день', w: '12 мес.', p: 'от 9 000 ₽' },
{ t: 'Регулировка света на стенде', d: 'Отдельно от ремонта', time: '30 мин', w: '—', p: '1 000 ₽' }
] },
{ title: 'Полировка и защита', note: 'Детейлинг — партнёр Alfa Car', rows: [
{ t: 'Полировка фар с лаком', d: 'Шлифовка, полировка, УФ-лак', time: '3 часа', w: '12 мес.', p: '3 000 ₽ / пара' },
{ t: 'Бронеплёнка на фары', d: 'Защита от камней и песка', time: '2 часа', w: '36 мес.', p: '4 500 ₽ / пара' },
{ t: 'Тонировка фонарей плёнкой', d: 'В рамках требований ПДД', time: '2 часа', w: '12 мес.', p: '3 500 ₽ / пара' }
] },
{ title: 'Ремонт по почте', note: 'Цены — без учёта доставки СДЭК', rows: [
{ t: 'Приёмка и диагностика', d: 'Видео вскрытия в Telegram', time: '1 день', w: '—', p: '0 ₽' },
{ t: 'Ремонт по прайсу выше', d: 'Цена та же, что в мастерской', time: '1–3 дня', w: '12 мес.', p: 'по прайсу' },
{ t: 'Упаковка и отправка обратно', d: 'Жёсткая коробка и пенопласт', time: '—', w: '—', p: '900 ₽' }
] }
];
return {
tabs: C.map((x, i) => ({ title: x.title, on: i === this.state.c, off: i !== this.state.c, pick: () => this.setState({ c: i }) })),
cat: C[this.state.c],
factors: [
{ t: 'Модель и тип фары', d: 'Галоген дешевле LED, Matrix — самый сложный ремонт.' },
{ t: 'Наличие запчастей', d: 'На популярные китайские модели стёкла держим на складе.' },
{ t: 'Объём повреждений', d: 'Одна причина или несколько — видно уже по фото.' },
{ t: 'Срочность', d: 'Ремонт за день без доплаты, если запчасть в наличии.' }
],
compare: [
{ car: 'Haval Jolion — ДХО', newp: '55 000 ₽', ours: '11 500 ₽' },
{ car: 'Geely Monjaro — стекло', newp: '78 000 ₽', ours: '12 500 ₽' },
{ car: 'Toyota RAV4 — запотевание', newp: '64 000 ₽', ours: '7 500 ₽' },
{ car: 'BMW X5 G05 — адаптив', newp: '210 000 ₽', ours: '38 000 ₽' }
]
};
}
}

comp=new Component({});render();
</script>
