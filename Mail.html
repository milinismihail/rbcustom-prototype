<script>

class DCLogic{constructor(p){this.props=p||{};this.state={}}setState(o){Object.assign(this.state,o);if(!window.__noRender)render()}}
const get=(p,s)=>{p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce((o,k)=>o==null?o:o[k],s)};
const one=/^\{\{\s*([\w.]+)\s*\}\}$/;
const interp=(t,s)=>t.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{const v=get(p,s);return v==null?'':v});
function walk(src,s,out){for(const n of src.childNodes){
 if(n.nodeType===3){out.appendChild(document.createTextNode(n.data.includes('{{')?interp(n.data,s):n.data));continue}
 if(n.nodeType!==1)continue;
 if(n.tagName==='TEMPLATE'&&n.dataset.for!==undefined){const list=get(n.dataset.for,s)||[];for(const it of list){walk(n.content,Object.assign({},s,{[n.dataset.as]:it}),out)}continue}
 if(n.tagName==='TEMPLATE'&&n.dataset.if!==undefined){if(get(n.dataset.if,s))walk(n.content,s,out);continue}
 const el=document.createElement(n.tagName.toLowerCase());
 for(const a of n.attributes){const m=a.value.match(one);
  if(a.name.startsWith('on')&&m){const fn=get(m[1],s);const ev=a.name.slice(2);if(typeof fn==='function'){el.addEventListener(ev==='change'?'change':ev,e=>{if(ev==='input'){window.__noRender=true;fn(e);window.__noRender=false}else fn(e)})}continue}
  if(a.name.startsWith('hint-'))continue;
  el.setAttribute(a.name,a.value.includes('{{')?interp(a.value,s):a.value)}
 walk(n.content||n,s,el);
 if(el.tagName==='INPUT'&&el.hasAttribute('value'))el.value=el.getAttribute('value');
 out.appendChild(el)}}
let comp;
function render(){const root=document.getElementById('root');const sels=[...root.querySelectorAll('select')].map(x=>x.value);const y=window.scrollY;
 const frag=document.createDocumentFragment();walk(document.getElementById('page').content,comp.renderVals(),frag);root.replaceChildren(frag);
 [...root.querySelectorAll('select')].forEach((x,i)=>{if(sels[i]!==undefined)x.value=sels[i]});window.scrollTo(0,y)}


class Component extends DCLogic {
constructor(p) { super(p); this.state = { c: 0, q: 0 }; }
renderVals() {
const C = [
{ n: 'Москва', s: 1400, d: '2–4 дня' }, { n: 'Мурманск', s: 2100, d: '4–6 дней' }, { n: 'Казань', s: 1900, d: '4–6 дней' }, { n: 'Нижний Новгород', s: 1800, d: '4–5 дней' },
{ n: 'Екатеринбург', s: 2300, d: '5–7 дней' }, { n: 'Новосибирск', s: 2900, d: '6–8 дней' }, { n: 'Краснодар', s: 2400, d: '5–7 дней' }, { n: 'Владивосток', s: 3900, d: '8–12 дней' }
];
const city = C[this.state.c];
const ship = city.s * (this.state.q === 0 ? 1 : 1.5);
const fmt = (n) => n.toLocaleString('ru-RU') + ' ₽';
const dd = city.d.split('–').map((x) => parseInt(x, 10));
return {
cities: C.map((x, i) => ({ n: x.n, i: String(i) })),
setCity: (e) => this.setState({ c: parseInt(e.target.value, 10) || 0 }),
qtys: ['Одна фара', 'Пара фар'].map((l, i) => ({ label: l, on: i === this.state.q, off: i !== this.state.q, pick: () => this.setState({ q: i }) })),
calc: { city: city.n, ship: fmt(Math.round(ship / 100) * 100), days: city.d, total: (dd[0] + 1) + '–' + (dd[1] + 3) + ' дней' },
steps: [
{ n: '1', t: 'Фото и описание', d: 'В WhatsApp или Telegram. Ответим с ценой за 15 минут.' },
{ n: '2', t: 'Снятие фары', d: 'Пришлём видео-инструкцию для вашей модели или подскажем сервис рядом.' },
{ n: '3', t: 'Упаковка и отправка', d: 'Фара в плёнку, коробка с жёстким наполнителем. Курьер СДЭК заберёт сам.' },
{ n: '4', t: 'Ремонт с видео', d: 'Снимаем ключевые этапы и проверку герметичности.' },
{ n: '5', t: 'Оплата и возврат', d: 'Платите после ремонта, фара уезжает в тот же день.' }
],
track: [
{ t: 'Заявка принята', d: '3 октября, 11:20', color: '#FFFFFF' },
{ t: 'Фара получена в мастерской', d: '6 октября, 14:05', color: '#FFFFFF' },
{ t: 'Ремонт: замена стекла и герметика', d: '7 октября, видео в чате', color: '#FFFFFF' },
{ t: 'Отправлена обратно, трек 10287436512', d: '8 октября, 18:40', color: '#F2B544' },
{ t: 'Доставлена', d: 'ожидается 11 октября', color: '#8A93A1' }
],
reviews: [
{ text: 'Дилер в Мурманске хотел 180 тысяч за фару Lexus. Отправил сюда, через 6 дней получил обратно, работает идеально.', name: 'Дмитрий', city: 'Мурманск', car: 'Lexus RX' },
{ text: 'Удобно, что всё в мессенджере: фото, цена, видео ремонта, трек. Даже не пришлось никуда ехать.', name: 'Ринат', city: 'Казань', car: 'VW Tiguan' },
{ text: 'Боялся, что разобьют в дороге. Упаковку объяснили подробно, всё доехало целым в обе стороны.', name: 'Олег', city: 'Екатеринбург', car: 'Kia K5' }
],
faq: [
{ q: 'Кто снимает фару?', a: 'Вы сами по нашей инструкции или любой сервис рядом. На многих машинах это 20–40 минут.' },
{ q: 'Что если фару повредят в пути?', a: 'Отправляем со страховкой на полную стоимость фары. За 410 отправок повреждений не было.' },
{ q: 'Как платить?', a: 'После ремонта, по ссылке или по счёту. Доставку в обе стороны можно оплатить при получении.' },
{ q: 'Работаете с юрлицами из регионов?', a: 'Да, по договору и безналу. Подробнее — на странице «Для бизнеса».' }
]
};
}
}

comp=new Component({});render();
</script>
