<script>

class DCLogic{constructor(p){this.props=p||{};this.state={}}setState(o){Object.assign(this.state,o);if(!window.__noRender)render()}}
const get=(p,s)=>{p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce((o,k)=>o==null?o:o[k],s)};
const one=/^\{\{\s*([\w.]+)\s*\}\}$/;
const interp=(t,s)=>t.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{const v=get(p,s);return v==null?'':v});
function walk(src,s,out){for(const n of src.childNodes){
 if(n.nodeType===3){out.appendChild(document.createTextNode(n.data.includes('{{')?interp(n.data,s):n.data));continue}
 if(n.nodeType!==1)continue;
 if(n.tagName==='TEMPLATE'&&n.dataset.for!==undefined){const list=get(n.dataset.for,s)||[];for(const it of list){walk(n.content,Object.assign({},s,{[n.dataset.as]:it}),out)}continue}
 if(n.tagName==='TEMPLATE'&&n.dataset.if!==undefined){if(get(n.dataset.if,s))walk(n.content,s,out);continue}
 const el=document.createElement(n.tagName.toLowerCase());
 for(const a of n.attributes){const m=a.value.match(one);
  if(a.name.startsWith('on')&&m){const fn=get(m[1],s);const ev=a.name.slice(2);if(typeof fn==='function'){el.addEventListener(ev==='change'?'change':ev,e=>{if(ev==='input'){window.__noRender=true;fn(e);window.__noRender=false}else fn(e)})}continue}
  if(a.name.startsWith('hint-'))continue;
  el.setAttribute(a.name,a.value.includes('{{')?interp(a.value,s):a.value)}
 walk(n.content||n,s,el);
 if(el.tagName==='INPUT'&&el.hasAttribute('value'))el.value=el.getAttribute('value');
 out.appendChild(el)}}
let comp;
function render(){const root=document.getElementById('root');const sels=[...root.querySelectorAll('select')].map(x=>x.value);const y=window.scrollY;
 const frag=document.createDocumentFragment();walk(document.getElementById('page').content,comp.renderVals(),frag);root.replaceChildren(frag);
 [...root.querySelectorAll('select')].forEach((x,i)=>{if(sels[i]!==undefined)x.value=sels[i]});window.scrollTo(0,y)}


class Component extends DCLogic {
constructor(p) { super(p); this.state = { g: 0 }; }
renderVals() {
const G = [
{ label: '2021–2023', count: '146', newp: 'от 55 000 ₽', faults: [
{ share: '38% обращений', t: 'Гаснет секция ДХО', d: 'Выгорают светодиоды в верхней полосе. Меняем диоды и драйвер.', newp: '55 000 ₽', ours: '11 500 ₽' },
{ share: '24% обращений', t: 'Запотевание после мойки', d: 'Слабое место — шов у нижнего края стекла.', newp: '55 000 ₽', ours: '7 500 ₽' },
{ share: '19% обращений', t: 'Трещина стекла от камня', d: 'Ставим новое стекло, корпус не трогаем.', newp: '55 000 ₽', ours: '10 500 ₽' },
{ share: '11% обращений', t: 'Сломано ушко крепления', d: 'Восстанавливаем пластик, фара держится как новая.', newp: '55 000 ₽', ours: '3 500 ₽' }
] },
{ label: '2024+ рестайлинг', count: '38', newp: 'от 64 000 ₽', faults: [
{ share: '41% обращений', t: 'Мерцает поворотник', d: 'Отказ драйвера бегущего поворотника.', newp: '64 000 ₽', ours: '12 500 ₽' },
{ share: '27% обращений', t: 'Трещина стекла', d: 'Стекло доступно под заказ, 3–5 дней.', newp: '64 000 ₽', ours: '12 000 ₽' },
{ share: '18% обращений', t: 'Конденсат в фаре', d: 'Переборка на новом герметике.', newp: '64 000 ₽', ours: '8 500 ₽' },
{ share: '9% обращений', t: 'Не горит задний фонарь', d: 'Ремонт LED-платы фонаря.', newp: '38 000 ₽', ours: '9 000 ₽' }
] }
];
const I = { hl4: 'img/hl4.jpg', hl1: 'img/hl1.jpg', tail1: 'img/tail1.jpg' };
return {
gens: G.map((x, i) => ({ label: x.label, on: i === this.state.g, off: i !== this.state.g, pick: () => this.setState({ g: i }) })),
gen: G[this.state.g],
cases: [
{ t: 'Jolion 2022 — секция ДХО', d: 'Заменили 14 светодиодов и драйвер.', p: '11 500 ₽ · 1 день', img: I.hl4 },
{ t: 'Jolion 2021 — запотевание', d: 'Новый герметик, тест давлением.', p: '7 500 ₽ · 1 день', img: I.hl1 },
{ t: 'Jolion 2024 — задний фонарь', d: 'Ремонт платы без замены фонаря.', p: '9 000 ₽ · 1 день', img: I.tail1 }
],
others: ['Chery Tiggo 7 Pro', 'Geely Monjaro', 'Geely Coolray', 'Lixiang L7', 'Zeekr 001', 'Changan CS55', 'Toyota Camry', 'Toyota RAV4', 'Kia Sportage', 'Hyundai Tucson', 'BMW X5', 'Mercedes GLE']
};
}
}

comp=new Component({});render();
