<script>

class DCLogic{constructor(p){this.props=p||{};this.state={}}setState(o){Object.assign(this.state,o);if(!window.__noRender)render()}}
const get=(p,s)=>{p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce((o,k)=>o==null?o:o[k],s)};
const one=/^\{\{\s*([\w.]+)\s*\}\}$/;
const interp=(t,s)=>t.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{const v=get(p,s);return v==null?'':v});
function walk(src,s,out){for(const n of src.childNodes){
 if(n.nodeType===3){out.appendChild(document.createTextNode(n.data.includes('{{')?interp(n.data,s):n.data));continue}
 if(n.nodeType!==1)continue;
 if(n.tagName==='TEMPLATE'&&n.dataset.for!==undefined){const list=get(n.dataset.for,s)||[];for(const it of list){walk(n.content,Object.assign({},s,{[n.dataset.as]:it}),out)}continue}
 if(n.tagName==='TEMPLATE'&&n.dataset.if!==undefined){if(get(n.dataset.if,s))walk(n.content,s,out);continue}
 const el=document.createElement(n.tagName.toLowerCase());
 for(const a of n.attributes){const m=a.value.match(one);
  if(a.name.startsWith('on')&&m){const fn=get(m[1],s);const ev=a.name.slice(2);if(typeof fn==='function'){el.addEventListener(ev==='change'?'change':ev,e=>{if(ev==='input'){window.__noRender=true;fn(e);window.__noRender=false}else fn(e)})}continue}
  if(a.name.startsWith('hint-'))continue;
  el.setAttribute(a.name,a.value.includes('{{')?interp(a.value,s):a.value)}
 walk(n.content||n,s,el);
 if(el.tagName==='INPUT'&&el.hasAttribute('value'))el.value=el.getAttribute('value');
 out.appendChild(el)}}
let comp;
function render(){const root=document.getElementById('root');const sels=[...root.querySelectorAll('select')].map(x=>x.value);const y=window.scrollY;
 const frag=document.createDocumentFragment();walk(document.getElementById('page').content,comp.renderVals(),frag);root.replaceChildren(frag);
 [...root.querySelectorAll('select')].forEach((x,i)=>{if(sels[i]!==undefined)x.value=sels[i]});window.scrollTo(0,y)}


class Component extends DCLogic {
constructor(p) { super(p); this.state = { step: 0, prob: 0, car: '', year: '', photos: false, name: '', phone: '', chan: 0, slot: -1 }; }
renderVals() {
const st = this.state;
const P = [
{ t: 'Запотевает', d: 'Конденсат или вода внутри' },
{ t: 'Не горит секция', d: 'ДХО, LED, поворотник' },
{ t: 'Разбита после ДТП', d: 'Стекло, корпус, крепления' },
{ t: 'Светит тускло', d: 'Мутные линзы, плохой свет' },
{ t: 'Мутное стекло', d: 'Нужна полировка' },
{ t: 'Другое', d: 'Опишем по фото' }
];
const CH = ['Telegram', 'WhatsApp', 'Звонок'];
const SL = ['Сегодня 17:00', 'Завтра 10:00', 'Завтра 12:30', 'Завтра 16:00', 'Пт 11:00', 'Сб 13:00'];
const labels = ['Поломка', 'Авто', 'Фото', 'Контакты'];
const imgs = ['img/hl1.jpg', 'img/night.jpg', 'img/hl2.jpg'];
const carName = (st.car || 'автомобиль') + (st.year ? ' ' + st.year : '');
return {
bar: labels.map((l, i) => ({ label: (i + 1) + '. ' + l, on: i <= st.step, off: i > st.step })),
s0: st.step === 0, s1: st.step === 1, s2: st.step === 2, s3: st.step === 3,
done: st.step === 4, notDone: st.step < 4,
canBack: st.step > 0 && st.step < 4, noBack: st.step === 0,
nextLabel: st.step === 3 ? 'Отправить' : (st.step === 2 && !st.photos ? 'Пропустить' : 'Далее →'),
next: () => this.setState({ step: Math.min(4, st.step + 1) }),
back: () => this.setState({ step: Math.max(0, st.step - 1) }),
restart: () => this.setState({ step: 0, prob: 0, car: '', year: '', photos: false, name: '', phone: '', chan: 0, slot: -1 }),
probs: P.map((x, i) => ({ t: x.t, d: x.d, on: i === st.prob, off: i !== st.prob, pick: () => this.setState({ prob: i }) })),
car: st.car, year: st.year,
setCar: (e) => this.setState({ car: e.target.value }),
setYear: (e) => this.setState({ year: e.target.value }),
popular: ['Haval Jolion', 'Geely Monjaro', 'Chery Tiggo 7 Pro', 'Toyota RAV4', 'Kia Sportage', 'Lixiang L7'].map((m) => ({ t: m, pick: () => this.setState({ car: m }) })),
noPhotos: !st.photos, hasPhotos: st.photos, photos: imgs,
addPhotos: () => this.setState({ photos: true }),
name: st.name, phone: st.phone,
setName: (e) => this.setState({ name: e.target.value }),
setPhone: (e) => this.setState({ phone: e.target.value }),
chans: CH.map((c, i) => ({ t: c, on: i === st.chan, off: i !== st.chan, pick: () => this.setState({ chan: i }) })),
slots: SL.map((s, i) => ({ t: s, on: i === st.slot, off: i !== st.slot, pick: () => this.setState({ slot: i }) })),
summary: (st.name ? st.name + ', мы' : 'Мы') + ' получили заявку: «' + P[st.prob].t.toLowerCase() + '», ' + carName + (st.photos ? ', 3 фото.' : ', без фото.'),
chanName: CH[st.chan],
slotName: st.slot >= 0 ? SL[st.slot] : 'после оценки',
after: [
{ n: '1', t: 'Мастер смотрит фото и называет цену под ключ' },
{ n: '2', t: 'Бронируем запчасть и время в мастерской' },
{ n: '3', t: 'Ремонт за 1 день, видео процесса в чат' },
{ n: '4', t: 'Гарантийный сертификат на 12 месяцев' }
]
};
